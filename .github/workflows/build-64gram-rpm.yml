name: Build 64Gram RPM

# Repackages the official 64Gram Linux release (x86_64) into an installable RPM.
#
# Why a repack: 64Gram ships Linux only as a raw .zip (Telegram + Updater) built
# by a private CI image that is not publicly pullable, so there is no public
# source-build path. Packaging the published binary is the same approach distro
# -bin packages take; the binary is statically linked against Qt, OpenSSL,
# ffmpeg and WebRTC and only needs the system glib/cairo/pango/fontconfig stack.
#
# Trigger: Actions -> this workflow -> Run workflow, or push a build-* tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: '64Gram version to package (e.g. 1.2.11) or "latest"'
        required: false
        default: latest
      publish:
        description: 'Create a GitHub release with the resulting RPM'
        type: boolean
        default: true
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM: TDesktop-x64/tdesktop

jobs:
  rpm:
    name: Build x86_64 RPM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          V="${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}"
          if [ -z "$V" ] || [ "$V" = "latest" ]; then
            V=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r .tag_name)
            V="${V#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Packaging 64Gram $V"

          # 64Gram versions are its own (1.2.11); the Telegram Desktop version it
          # is based on (7.3.5) lives in the upstream release commit message and
          # is what "Provides: telegram-desktop" has to advertise.
          UVER=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM}/commits/v${V}" \
            | jq -r '.commit.message' \
            | sed -n 's/.*Upstream version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "upstream-version=${UVER}" >> "$GITHUB_OUTPUT"
          echo "Upstream Telegram Desktop version: ${UVER:-<unknown, spec default>}"

      - name: Stage files
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p stage dist

          URL="https://github.com/${UPSTREAM}/releases/download/v${V}/64Gram_${V}_linux.zip"
          echo "Downloading $URL"
          curl -fL --retry 3 --retry-delay 5 -o /tmp/upstream.zip "$URL"
          sha256sum /tmp/upstream.zip | tee /tmp/upstream.sha256

          unzip -o -q /tmp/upstream.zip -d stage
          test -f stage/Telegram || { echo "Telegram binary missing from archive"; exit 1; }
          file stage/Telegram

          curl -fL --retry 3 -o stage/LICENSE \
            "https://raw.githubusercontent.com/${UPSTREAM}/dev/LICENSE"

          cp packaging/io.github.tdesktop_x64.TDesktop.desktop \
             packaging/io.github.tdesktop_x64.TDesktop.service \
             packaging/io.github.tdesktop_x64.TDesktop.metainfo.xml \
             stage/
          for sz in 16 32 48 64 128 256 512; do
            curl -fL --retry 3 -o "stage/icon${sz}.png" \
              "https://raw.githubusercontent.com/${UPSTREAM}/dev/Telegram/Resources/art/icon${sz}.png"
          done

          tar -C stage -czf stage.tgz .
          ls -lh stage.tgz

      - name: Build RPM
        run: |
          set -euo pipefail
          docker run --rm -u 0 \
            -e VERSION="${{ steps.ver.outputs.version }}" \
            -e UVER="${{ steps.ver.outputs.upstream-version }}" \
            -v "$PWD:/w" -w /w \
            almalinux:8 bash -lc '
              set -euo pipefail
              dnf -y -q install rpm-build >/dev/null
              rpm --version

              # rpmbuild resolves %{SOURCEn} under <topdir>/SOURCES (uppercase)
              mkdir -p /tmp/r/SOURCES /tmp/r/SPECS /tmp/r/RPMS /tmp/r/BUILD /tmp/r/BUILDROOT
              tar -C /tmp/r/SOURCES -xzf /w/stage.tgz
              ls -lh /tmp/r/SOURCES

              # --define needs "name body" as ONE argument, hence the array.
              DEFS=(--define "_topdir /tmp/r" --define "gver ${VERSION}")
              if [ -n "${UVER}" ]; then DEFS+=(--define "uver ${UVER}"); fi
              rpmbuild -bb "${DEFS[@]}" /w/packaging/64gram.spec

              mkdir -p /w/dist
              cp /tmp/r/RPMS/x86_64/*.rpm /w/dist/
              cd /w/dist
              sha256sum *.rpm > SHA256SUMS

              { rpm -qpi *.rpm; echo; echo "### Requires"; rpm -qp --requires *.rpm; \
                echo; echo "### Provides"; rpm -qp --provides *.rpm; \
                echo; echo "### Contents"; rpm -qpl *.rpm; } > /w/metadata.md
            '
          ls -lh dist/

      - name: Record metadata
        run: cat metadata.md >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test install
        # Installs the package into a clean container and asserts the two things
        # that actually matter: it resolves its dependencies, and tg:// ends up
        # routed to this application.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/dist:/dist:ro" almalinux:9 bash -lc '
            set -euo pipefail
            dnf -y -q install desktop-file-utils >/dev/null
            dnf -y -q install /dist/*.rpm

            echo "--- package ---"
            rpm -q 64gram
            test -x /usr/bin/64gram
            test -L /usr/bin/telegram-desktop

            echo "--- provides / obsoletes ---"
            rpm -q --provides 64gram | grep -E "^telegram-desktop = "
            rpm -q --obsoletes 64gram

            echo "--- desktop entry ---"
            test -f /usr/share/applications/io.github.tdesktop_x64.TDesktop.desktop
            grep -E "^(Exec|Icon|StartupWMClass|MimeType)=" \
              /usr/share/applications/io.github.tdesktop_x64.TDesktop.desktop

            echo "--- tg:// routing ---"
            TG=$(grep "^x-scheme-handler/tg=" /usr/share/applications/mimeinfo.cache || true)
            echo "${TG:-<not registered>}"
            case "$TG" in
              "x-scheme-handler/tg=io.github.tdesktop_x64.TDesktop.desktop"*) ;;
              *) echo "FAIL: tg:// is not routed to 64gram"; exit 1 ;;
            esac

            echo "--- dbus / appstream ---"
            test -f /usr/share/dbus-1/services/io.github.tdesktop_x64.TDesktop.service
            test -f /usr/share/metainfo/io.github.tdesktop_x64.TDesktop.metainfo.xml
            echo OK
          '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 64gram-rpm-${{ steps.ver.outputs.version }}-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ steps.ver.outputs.version }}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* \
            --title "64Gram ${{ steps.ver.outputs.version }} RPM" \
            --notes "64Gram ${{ steps.ver.outputs.version }} (Telegram Desktop ${{ steps.ver.outputs.upstream-version }}) repackaged as an RPM for x86_64 (RHEL/Rocky/Alma 8+, Fedora).

          Installs as **64gram**, replaces the official \`telegram-desktop\` package (\`Obsoletes\`) and takes over the \`tg://\` / \`tonsite://\` / \`ton://\` handlers.

          \`\`\`
          sudo dnf install ./64gram-${{ steps.ver.outputs.version }}-2.*.x86_64.rpm
          \`\`\`
          " \
            --repo "$GITHUB_REPOSITORY"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### 64Gram ${{ steps.ver.outputs.version }} RPM"
            echo ""
            echo "- source: \`${UPSTREAM}\` release v${{ steps.ver.outputs.version }}"
            echo "- telegram-desktop version advertised: ${{ steps.ver.outputs.upstream-version }}"
            echo "- package: \`$(ls dist/*.rpm | xargs -n1 basename)\`"
            if [ -n "${RELEASE_URL:-}" ]; then echo "- release: ${RELEASE_URL}"; fi
          } >> "$GITHUB_STEP_SUMMARY"
